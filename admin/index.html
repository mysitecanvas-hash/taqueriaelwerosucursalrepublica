<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Panel | Taquería El Güero</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f3f3;

            color: #222;

        }


        /* =================================================
           HEADER
        ================================================= */

        .header {

            background: #151515;

            color: white;

            padding: 20px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .header h1 {

            font-size: 22px;

        }


        .header span {

            color: #f39a24;

            font-weight: bold;

        }


        /* =================================================
           CONTENEDOR
        ================================================= */

        .container {

            max-width: 1200px;

            margin: auto;

            padding: 30px 20px;

        }


        /* =================================================
           TARJETAS
        ================================================= */

        .card {

            background: white;

            border-radius: 12px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,.08);

        }


        .card h2 {

            margin-bottom: 20px;

            font-size: 21px;

        }


        /* =================================================
           FORMULARIOS
        ================================================= */

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 18px;

        }


        .field {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .field label {

            font-weight: bold;

            font-size: 14px;

        }


        .field input,
        .field select,
        .field textarea {

            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

        }


        .field textarea {

            min-height: 90px;

            resize: vertical;

        }


        /* =================================================
           BOTONES
        ================================================= */

        button {

            border: none;

            border-radius: 7px;

            padding: 10px 16px;

            cursor: pointer;

            font-weight: bold;

        }


        .btn-primary {

            background: #c84b08;

            color: white;

        }


        .btn-primary:hover {

            background: #a93d06;

        }


        .btn-secondary {

            background: #ddd;

            color: #222;

        }


        .btn-danger {

            background: #c62828;

            color: white;

        }


        .actions {

            margin-top: 20px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        /* =================================================
           PRODUCTOS
        ================================================= */

        .products {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 18px;

        }


        .seccion-productos-grupo {

            margin-bottom: 30px;

            padding-bottom: 25px;

            border-bottom: 1px solid #eee;

        }


        .seccion-productos-grupo:last-child {

            border-bottom: none;

            margin-bottom: 0;

            padding-bottom: 0;

        }


        .seccion-productos-titulo {

            font-size: 17px;

            margin-bottom: 14px;

            color: #c84b08;

        }


        .product {

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 18px;

            background: #fafafa;

        }


        .product h3 {

            margin-bottom: 8px;

        }


        .product-description {

            color: #666;

            font-size: 14px;

            min-height: 35px;

        }


        .product-price {

            font-size: 22px;

            font-weight: bold;

            color: #c84b08;

            margin: 12px 0;

        }


        .product-status {

            font-size: 13px;

            margin-bottom: 12px;

        }


        .activo {

            color: green;

            font-weight: bold;

        }


        .inactivo {

            color: red;

            font-weight: bold;

        }


        /* =================================================
           SECCIONES
        ================================================= */

        .sections {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 15px;

        }


        .section {

            border: 1px solid #ddd;

            padding: 16px;

            border-radius: 10px;

        }


        /* =================================================
           ESTADO
        ================================================= */

        #estado {

            position: fixed;

            bottom: 20px;

            right: 20px;

            background: #151515;

            color: white;

            padding: 13px 18px;

            border-radius: 8px;

            display: none;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,.25);

        }


        /* =================================================
           MODAL
        ================================================= */

        .modal {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.6);

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 200;

            padding: 20px;

        }


        .modal-content {

            background: white;

            width: 100%;

            max-width: 600px;

            border-radius: 12px;

            padding: 25px;

            max-height: 90vh;

            overflow-y: auto;

        }


        .modal-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .close {

            font-size: 25px;

            cursor: pointer;

        }


        @media (max-width: 600px) {

            .header {

                padding: 15px;

            }

            .header h1 {

                font-size: 18px;

            }

            .container {

                padding: 20px 12px;

            }

        }

    </style>

</head>


<body>


<header class="header">

    <h1>
        🌮 Taquería El Güero
    </h1>

    <span>
        PANEL ADMIN
    </span>

</header>


<main class="container">


    <!-- =================================================
         CONFIGURACIÓN
    ================================================== -->

    <section class="card">

        <h2>
            ⚙️ Información del negocio
        </h2>


        <div class="form-grid">


            <div class="field">

                <label>
                    Nombre
                </label>

                <input
                    id="nombre"
                    type="text">

            </div>


            <div class="field">

                <label>
                    Sucursal
                </label>

                <input
                    id="sucursal"
                    type="text">

            </div>


            <div class="field">

                <label>
                    WhatsApp
                </label>

                <input
                    id="whatsapp"
                    type="text">

            </div>


            <div class="field">

                <label>
                    Facebook
                </label>

                <input
                    id="facebook"
                    type="text">

            </div>


            <div class="field">

                <label>
                    Google Maps
                </label>

                <input
                    id="maps"
                    type="text">

            </div>


            <div class="field">

                <label>
                    Dirección
                </label>

                <input
                    id="direccion"
                    type="text">

            </div>


            <div
                class="field"
                style="grid-column:1/-1">

                <label>
                    Descripción
                </label>

                <textarea
                    id="descripcion">
                </textarea>

            </div>


        </div>


        <div class="actions">

            <button
                class="btn-primary"
                onclick="guardarConfiguracion()">

                💾 Guardar configuración

            </button>

        </div>

    </section>


    <!-- =================================================
         PRODUCTOS
    ================================================== -->

    <section class="card">

        <h2>
            🌮 Productos
        </h2>


        <div
            id="productos"
            class="products">

            Cargando productos...

        </div>


        <div class="actions">

            <button
                class="btn-primary"
                onclick="nuevoProducto()">

                ➕ Agregar producto

            </button>

        </div>

    </section>


    <!-- =================================================
         SECCIONES
    ================================================== -->

    <section class="card">

        <h2>
            🧩 Secciones
        </h2>


        <div
            id="secciones"
            class="sections">

            Cargando secciones...

        </div>


        <div class="actions">

            <button
                class="btn-primary"
                onclick="nuevaSeccion()">

                ➕ Agregar sección

            </button>

        </div>

    </section>


</main>


<!-- =====================================================
     MODAL PRODUCTO
====================================================== -->

<div
    id="modalProducto"
    class="modal">


    <div class="modal-content">


        <div class="modal-header">

            <h2>
                🌮 Producto
            </h2>

            <span
                class="close"
                onclick="cerrarModal('modalProducto')">

                ×

            </span>

        </div>


        <input
            id="producto-id"
            type="hidden">


        <div class="form-grid">


            <div class="field">

                <label>
                    Sección
                </label>

                <select
                    id="producto-seccion">
                </select>

            </div>


            <div class="field">

                <label>
                    Nombre
                </label>

                <input
                    id="producto-nombre"
                    type="text">

            </div>


            <div class="field">

                <label>
                    Precio
                </label>

                <input
                    id="producto-precio"
                    type="number"
                    step="0.01">

            </div>


            <div class="field">

                <label>
                    Orden
                </label>

                <input
                    id="producto-orden"
                    type="number">

            </div>


            <div
                class="field"
                style="grid-column:1/-1">

                <label>
                    Descripción
                </label>

                <textarea
                    id="producto-descripcion">
                </textarea>

            </div>


            <div class="field">

                <label>
                    Imagen
                </label>

                <input
                    id="producto-imagen"
                    type="text"
                    placeholder="URL de imagen">

            </div>


            <div class="field">

                <label>
                    Activo
                </label>

                <select
                    id="producto-activo">

                    <option value="true">
                        Sí
                    </option>

                    <option value="false">
                        No
                    </option>

                </select>

            </div>


        </div>


        <div class="actions">

            <button
                class="btn-primary"
                onclick="guardarProducto()">

                💾 Guardar

            </button>

            <button
                class="btn-secondary"
                onclick="cerrarModal('modalProducto')">

                Cancelar

            </button>

        </div>


    </div>

</div>


<!-- =====================================================
     MODAL SECCIÓN
====================================================== -->

<div
    id="modalSeccion"
    class="modal">


    <div class="modal-content">


        <div class="modal-header">

            <h2>
                🧩 Sección
            </h2>

            <span
                class="close"
                onclick="cerrarModal('modalSeccion')">

                ×

            </span>

        </div>


        <input
            id="seccion-id"
            type="hidden">


        <div class="form-grid">


            <div class="field">

                <label>
                    Nombre
                </label>

                <input
                    id="seccion-nombre"
                    type="text">

            </div>


            <div class="field">

                <label>
                    Orden
                </label>

                <input
                    id="seccion-orden"
                    type="number">

            </div>


            <div
                class="field"
                style="grid-column:1/-1">

                <label>
                    Descripción
                </label>

                <textarea
                    id="seccion-descripcion">
                </textarea>

            </div>


            <div class="field">

                <label>
                    Activa
                </label>

                <select
                    id="seccion-activo">

                        Sí
                    </option>

                    <option value="false">
                        No
                    </option>

                </select>

            </div>


        </div>


        <div class="actions">

            <button
                class="btn-primary"
                onclick="guardarSeccion()">

                💾 Guardar

            <button

                onclick="cerrarModal('modalSeccion')">

                Cancelar

            </button>

        </div>


    </div>

</div>


<div id="estado"></div>


<script>


/* =====================================================
   API
===================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbzO3R7nWb_u0UwZLjM1Z8zbh1E5cjV6yfxtjv9z_NtnBO13LbfoFBSx9wTCfGElkvW6Kw/exec";


let datosActuales = {

    config: {},

    productos: [],

    secciones: []

};


/* =====================================================
   CARGAR TODO
===================================================== */

async function cargarTodo() {

    mostrarEstado(
        "Cargando información..."
    );


    try {

        const respuesta =
            await fetch(
                API_URL +
                "?accion=todo&_=" +
                Date.now()
            );


        const datos =
            await respuesta.json();


        console.log(
            "Respuesta completa de API:",
            datos
        );


        if (!datos.ok) {

            throw new Error(
                datos.error ||
                "La API devolvió un error."
            );

        }


        /*
         * =================================================
         * LA API DEVUELVE LOS DATOS DENTRO DE "data"
         * =================================================
         */

        const contenido =
            datos.data || datos;


        if (!contenido) {

            throw new Error(
                "La API no devolvió información."
            );

        }


        datosActuales = {

            config:
                contenido.config || {},

            productos:
                contenido.productos || [],

            secciones:
                contenido.secciones || []

        };


        /*
         * =================================================
         * CONFIGURACIÓN
         * =================================================
         */

        cargarConfiguracion(
            datosActuales.config
        );


        /*
         * =================================================
         * PRODUCTOS
         * =================================================
         */

        mostrarProductos(
            datosActuales.productos
        );


        /*
         * =================================================
         * SECCIONES
         * =================================================
         */

        mostrarSecciones(
            datosActuales.secciones
        );


        mostrarEstado(
            "Información cargada"
        );

    }


    catch (error) {

        console.error(
            "Error cargando panel:",
            error
        );


        mostrarEstado(
            "Error al cargar información"
        );


        alert(
            "No se pudo cargar el panel: " +
            error.message
        );

    }

}

/* =====================================================
   CONFIGURACIÓN
===================================================== */

function cargarConfiguracion(
    config
) {

    document.getElementById(
        "nombre"
    ).value =
        config.nombre || "";


    document.getElementById(
        "sucursal"
    ).value =
        config.sucursal || "";


    document.getElementById(
        "descripcion"
    ).value =
        config.descripcion || "";


    document.getElementById(
        "whatsapp"
    ).value =
        config.whatsapp || "";


    document.getElementById(
        "facebook"
    ).value =
        config.facebook || "";


    document.getElementById(
        "maps"
    ).value =
        config.maps || "";


    document.getElementById(
        "direccion"
    ).value =
        config.direccion || "";

}


/* =====================================================
   MOSTRAR PRODUCTOS
===================================================== */

function crearTarjetaProducto(
    producto
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "product";


       div.innerHTML = `

        <span class="product-row-nombre">
            ${escaparHTML(
                producto.nombre
            )}
        </span>

        <span class="product-row-precio">
            $${producto.precio}
        </span>

        <span class="product-row-estado ${
            producto.activo
            ? "activo"
            : "inactivo"
        }">

            ${
                producto.activo
                ? "Activo"
                : "Inactivo"
            }

        </span>

        <div class="actions">

            <button
                class="btn-primary"
                onclick="editarProducto(${producto.id})">

                ✏️ Editar

            </button>

            <button
                class="btn-danger"
                onclick="eliminarProducto(${producto.id})">

                🗑️ Eliminar

            </button>

        </div>

    `;


    return div;

}


function crearGrupoSeccion(
    nombreSeccion,
    tituloMostrado,
    productosDeSeccion
) {

    const grupo =
        document.createElement(
            "div"
        );

    grupo.className =
        "seccion-productos-grupo";


    const encabezado =
        document.createElement(
            "h3"
        );

    encabezado.className =
        "seccion-productos-titulo";

    encabezado.textContent =
        "🧩 " + tituloMostrado;

    grupo.appendChild(
        encabezado
    );


    const grid =
        document.createElement(
            "div"
        );

    grid.className =
        "products";


    if (
        productosDeSeccion.length === 0
    ) {

        const vacio =
            document.createElement(
                "p"
            );

        vacio.textContent =
            "Sin productos en esta sección.";

        grid.appendChild(
            vacio
        );

    }
    else {

        productosDeSeccion.forEach(
            producto => {

                grid.appendChild(
                    crearTarjetaProducto(
                        producto
                    )
                );

            }
        );

    }

    grupo.appendChild(
        grid
    );


    const acciones =
        document.createElement(
            "div"
        );

    acciones.className =
        "actions";


    const boton =
        document.createElement(
            "button"
        );

    boton.className =
        "btn-primary";

    boton.textContent =
        "➕ Agregar producto";

    boton.onclick =
        function() {
            nuevoProducto(
                nombreSeccion
            );
        };

    acciones.appendChild(
        boton
    );

    grupo.appendChild(
        acciones
    );


    return grupo;

}


/* =====================================================
   MOSTRAR PRODUCTOS (AGRUPADOS POR SECCIÓN)
===================================================== */

function mostrarProductos(
    productos
) {

    const contenedor =
        document.getElementById(
            "productos"
        );


    contenedor.innerHTML = "";


    const listaProductos =
        productos || [];

    const secciones =
        (datosActuales.secciones || [])
            .slice()
            .sort(function(a, b) {
                return (
                    (a.orden || 0) -
                    (b.orden || 0)
                );
            });


    if (
        secciones.length === 0 &&
        listaProductos.length === 0
    ) {

        contenedor.innerHTML =
            "<p>No hay productos.</p>";

        return;

    }


    secciones.forEach(
        seccion => {

            const productosDeSeccion =
                listaProductos.filter(
                    p =>
                        (p.seccion || "") ===
                        seccion.nombre
                );

            contenedor.appendChild(
                crearGrupoSeccion(
                    seccion.nombre,
                    seccion.nombre,
                    productosDeSeccion
                )
            );

        }
    );


    const nombresSecciones =
        secciones.map(
            s => s.nombre
        );

    const productosSinSeccion =
        listaProductos.filter(
            p =>
                !nombresSecciones.includes(
                    p.seccion || ""
                )
        );

    if (
        productosSinSeccion.length > 0
    ) {

        contenedor.appendChild(
            crearGrupoSeccion(
                "",
                "Sin sección",
                productosSinSeccion
            )
        );

    }

}


/* =====================================================
   MOSTRAR SECCIONES
===================================================== */

function mostrarSecciones(
    secciones
) {

    const contenedor =
        document.getElementById(
            "secciones"
        );


    contenedor.innerHTML = "";


    secciones.forEach(
        seccion => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "section";


            div.innerHTML = `

                <h3>
                    ${escaparHTML(
                        seccion.nombre
                    )}
                </h3>

                <p>
                    ${escaparHTML(
                        seccion.descripcion || ""
                    )}
                </p>

                <br>

                <strong>
                    ${
                        seccion.activo
                        ? "Activa"
                        : "Inactiva"
                    }
                </strong>

                 <div class="actions">

                    <button
                        class="btn-primary"
                        onclick="editarSeccion(${seccion.id})">

                        ✏️ Editar

                    </button>

                    <button
                        class="btn-danger"
                        onclick="eliminarSeccion(${seccion.id})">

                        🗑️ Eliminar

                    </button>

                </div>

            `;


            contenedor.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   EDITAR PRODUCTO
===================================================== */

/* =====================================================
   SELECT DE SECCIONES (PRODUCTO)
===================================================== */

function poblarSelectSeccionesProducto(
    valorSeleccionado
) {

    const select =
        document.getElementById(
            "producto-seccion"
        );

    select.innerHTML = "";

    const secciones =
        (datosActuales.secciones || [])
            .slice()
            .sort(function(a, b) {
                return (
                    (a.orden || 0) -
                    (b.orden || 0)
                );
            });

    secciones.forEach(function(seccion) {

        const opcion =
            document.createElement(
                "option"
            );

        opcion.value =
            seccion.nombre;

        opcion.textContent =
            seccion.nombre;

        select.appendChild(
            opcion
        );

    });

    if (valorSeleccionado) {
        select.value =
            valorSeleccionado;
    }

}


function editarProducto(
    id
) {

    const producto =
        datosActuales.productos.find(
            p =>
                String(p.id) ===
                String(id)
        );


    if (!producto) {
        return;
    }


    document.getElementById(
        "producto-id"
    ).value =
        producto.id;


    poblarSelectSeccionesProducto(
        producto.seccion || ""
    );


    document.getElementById(
        "producto-nombre"
    ).value =
        producto.nombre || "";


    document.getElementById(
        "producto-descripcion"
    ).value =
        producto.descripcion || "";


    document.getElementById(
        "producto-precio"
    ).value =
        producto.precio || 0;


    document.getElementById(
        "producto-imagen"
    ).value =
        producto.imagen || "";


    document.getElementById(
        "producto-orden"
    ).value =
        producto.orden || 0;


    document.getElementById(
        "producto-activo"
    ).value =
        producto.activo
        ? "true"
        : "false";


    abrirModal(
        "modalProducto"
    );

}


/* =====================================================
   NUEVO PRODUCTO
===================================================== */

function nuevoProducto(
    seccionPreseleccionada
) {

    document.getElementById(
        "producto-id"
    ).value = "";


    poblarSelectSeccionesProducto(
        seccionPreseleccionada || ""
    );


    document.getElementById(

/* =====================================================
   POST
===================================================== */

async function enviarPOST(datos) {

    mostrarEstado(
        "Guardando..."
    );


    try {

        const parametros =
            new URLSearchParams();


        /*
         * Acción
         */

        parametros.append(
            "accion",
            datos.accion
        );


        /*
         * Datos del objeto
         */

        if (datos.data) {

            Object.keys(
                datos.data
            ).forEach(
                function(campo) {

                    let valor =
                        datos.data[campo];


                    if (
                        valor === null ||
                        valor === undefined
                    ) {

                        valor = "";

                    }


                    parametros.append(
                        campo,
                        valor
                    );

                }
            );

        }


        /*
         * ID
         */

        if (
            datos.id !== undefined &&
            datos.id !== null
        ) {

            parametros.append(
                "id",
                datos.id
            );

        }


        /*
         * Enviar como GET
         */

        const respuesta =
            await fetch(
                API_URL +
                "?" +
                parametros.toString()
            );


        if (!respuesta.ok) {

            throw new Error(
                "Error HTTP " +
                respuesta.status
            );

        }


        const resultado =
            await respuesta.json();


        if (!resultado.ok) {

            throw new Error(
                resultado.error ||
                "No se pudo guardar."
            );

        }


        mostrarEstado(
            "Guardado correctamente"
        );


        return resultado;

    }


    catch (error) {

        console.error(
            "Error al guardar:",
            error
        );


        mostrarEstado(
            "Error al guardar"
        );


        alert(
            "No se pudo guardar: " +
            error.message
        );


        return null;

    }

}

/* =====================================================

===================================================== */

function abrirModal(
    id
) {

    document.getElementById(
        id
    ).style.display =
        "flex";

}


function cerrarModal(
    id
) {

    document.getElementById(
        id
    ).style.display =
        "none";

}


/* =====================================================
   ESTADO
===================================================== */

function mostrarEstado(
    mensaje
) {

    const estado =
        document.getElementById(
            "estado"
        );


    estado.textContent =
        mensaje;


    estado.style.display =
        "block";


    setTimeout(
        function() {

            estado.style.display =
                "none";

        },
        2500
    );

}


/* =====================================================
   SEGURIDAD HTML
===================================================== */

function escaparHTML(
    texto
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto ?? "";


    return div.innerHTML;

}
